<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        h1 {
            color: #333333;
            font-size: 26px;
            text-align: center;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #5563c1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="head">Fill the Requirements</h1>
        <form action="insert.php" method="POST">
            <input type="text" placeholder="Enter name" id="name-input" name="name" required>
            <input type="email" placeholder="Enter your email" id="email-input" name="email" required>
            <input type="password" placeholder="Enter your password" id="password-input" name="password" required>
            <input type="text" placeholder="Enter your message" id="message-input" name="message">
            <button type="submit" id="btn">Submit</button>
        </form>
    </div>
</body>
</html>
